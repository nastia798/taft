# Netlify: сайт собирается командой npm run build, публикуется папка dist.
# Адрес сайта для sitemap.xml и canonical задай в Site settings → Environment variables:
#   SITE_URL = https://твой-сайт.netlify.app
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
